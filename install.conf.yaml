- defaults:
    link:
      relink: true

- clean: ["~", "~/.claude/skills"]

- create:
    - ~/.tmux/plugins
    - ~/.config
    - ~/.irb
    - ~/.agents
    - ~/.claude/skills
    - ~/.codex
    - ~/.config/muse

- link:
    ~/.gitconfig: git/gitconfig
    ~/.gitignore_global: git/gitignore_global

    ~/.tmux.conf: tmux/tmux.conf
    ~/.tmux/plugins/tpm: tmux/tpm

    ~/.vim: vim
    ~/.config/nvim: nvim

    ~/.phoenix.js: phoenix/phoenix.js

    ~/.emacs.d: emacs.d

    ~/.zsh: zsh
    ~/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv

    ~/.iterm2: iterm2
    ~/.irbrc: irb/irbrc
    ~/.ctags: ctags/ctags

    # Coding agents (Claude Code, Codex, Muse) -- see .agents/AGENTS.md
    ~/.agents/skills: .agents/skills
    ~/.claude/skills/:
      glob: true
      path: .agents/skills/*
    ~/.claude/CLAUDE.md: .agents/AGENTS.md
    ~/.claude/settings.json: .agents/claude/settings.json
    ~/.codex/AGENTS.md: .agents/AGENTS.md
    ~/.codex/config.toml: .agents/codex/config.toml
    ~/.config/muse/settings.json: .agents/muse/settings.json

- shell:
    - description: Ensure Homebrew is installed
      command: |
        if ! [[ $( which brew ) ]]
        then
          echo "Installing homebrew..."
          ruby -e "$( curl -fsSL https://raw.githubusercontent.com/Homebrew/install/master/install )"
        fi
      stderr: true
      stdout: true

- tap:
    - homebrew/cask-fonts
- brew:
    - ag
    - fzf
    - git
    - go
    - ispell
    - node
    - nvim
    - python
    - python3
    - tmux
    - vim
    - codespell
    - prettier
    - markdownlint-cli
- cask:
    - phoenix
    # dev icons
    - font-source-code-pro
    - font-sauce-code-pro-nerd-font

- shell:
    - description: Setup neovim plugins
      command: |
        pip3 install --upgrade neovim
        pip3 install --upgrade typing
      stderr: true
      stdout: true

- shell:
    - [git submodule update --init --recursive, Installing submodules]
    - [sh ~/.tmux/plugins/tpm/scripts/install_plugins.sh, Install tpm plugins]
